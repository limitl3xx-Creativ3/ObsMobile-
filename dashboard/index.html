<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBS Mobile — Build Dashboard</title>
<style>
  :root { color-scheme: dark; }
  body { background:#141418; color:#e8e8ea; font:15px/1.5 -apple-system,system-ui,sans-serif; margin:0; padding:2rem; }
  .card { background:#1e1e24; border:1px solid #2c2c33; border-radius:14px; padding:1.5rem; max-width:560px; margin:0 auto 1rem; }
  h1 { font-size:1.4rem; margin:0 0 .25rem; }
  .muted { color:#9aa0a6; font-size:.85rem; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }
  .dot.queued,.dot.in_progress { background:#fbbc05; animation:pulse 1s infinite alternate; }
  .dot.success { background:#34a853; }
  .dot.failure { background:#ea4335; }
  .dot.idle { background:#555; }
  @keyframes pulse { to { opacity:.4; } }
  .btn { display:block; text-align:center; background:#8ab4f8; color:#111; font-weight:700;
         padding:.9rem; border-radius:10px; text-decoration:none; margin-top:1rem; }
  .btn[aria-disabled] { background:#3a3a42; color:#777; pointer-events:none; }
  input { width:100%; box-sizing:border-box; padding:.7rem; border-radius:8px;
          border:1px solid #3a3a42; background:#141418; color:#eee; font-family:monospace; }
  button { margin-top:.5rem; padding:.6rem 1.2rem; border:0; border-radius:8px;
           background:#8ab4f8; color:#111; font-weight:700; cursor:pointer; }
  .runs li { list-style:none; padding:.25rem 0; font-size:.85rem; color:#9aa0a6; }
  ul.runs { margin:.5rem 0 0; padding:0; }
  a { color:#8ab4f8; }
</style>
</head>
<body>
  <div class="card">
    <h1>▶ OBS Mobile</h1>
    <div class="muted">Live build status &amp; installable APK</div>
    <p id="status"><span class="dot idle"></span>Waiting for repo…</p>
    <div id="meta" class="muted"></div>
    <a id="apkbtn" class="btn" aria-disabled="true" href="#">⬇ Download APK</a>
  </div>

  <div class="card">
    <div class="muted">GitHub repo (owner/name — push this project there)</div>
    <input id="repo" placeholder="e.g. yourname/ObsMobile">
    <button onclick="save()">Save &amp; watch</button>
    <ul class="runs" id="runs"></ul>
  </div>

<script>
const $ = id => document.getElementById(id);
let repo = localStorage.getItem("repo") || "";
$("repo").value = repo;

async function save() {
  repo = $("repo").value.trim();
  localStorage.setItem("repo", repo);
  await fetch("/api/repo", { method: "POST", body: JSON.stringify({ repo }) });
  poll();
}

function fmt(b) {
  if (!b) return "—";
  const d = new Date(b); return d.toLocaleString();
}

async function poll() {
  if (!repo) return;
  try {
    const s = await (await fetch("/api/status")).json();
    if (!s.repo) return;
    const cls = s.status === "completed" ? (s.conclusion || "idle") : (s.status || "idle");
    const label = s.status === "completed"
      ? (s.conclusion === "success" ? "Build succeeded" : `Build ${s.conclusion}`)
      : `Build ${s.status || "not started yet"}`;
    $("status").innerHTML = `<span class="dot ${cls}"></span>${label}`;
    $("meta").innerHTML = s.commitMsg
      ? `Last commit: ${s.commitMsg}<br>Updated: ${fmt(s.updatedAt)}${s.apk ? `<br>APK: ${s.apk.name} (${(s.apk.size/1e6).toFixed(1)} MB, ${fmt(s.apk.updated)})` : "<br>APK: not published yet"}`
      : "";
    const b = $("apkbtn");
    if (s.apk) { b.href = s.apk.url; b.removeAttribute("aria-disabled"); b.textContent = "⬇ Download & install APK"; }
    else { b.setAttribute("aria-disabled", "true"); }
    $("runs").innerHTML = (s.runs || []).map(r =>
      `<li><span class="dot ${r.conclusion || r.status || "idle"}" style="width:8px;height:8px"></span>${r.status} · ${r.conclusion || ""} · ${fmt(r.updatedAt)}</li>`).join("");
  } catch (e) { /* ignore */ }
}
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
